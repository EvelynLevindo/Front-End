<section class="curriculo-form">
  <h1>{{ pageTitle }}</h1>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Nome completo
      <input type="text" formControlName="nome" placeholder="Digite seu nome" />
    </label>
    <div class="error" *ngIf="field['nome'].invalid && field['nome'].touched">Nome é obrigatório.</div>

    <label>
      Email
      <input type="email" formControlName="email" placeholder="Digite seu email" />
    </label>
    <div class="error" *ngIf="field['email'].invalid && field['email'].touched">
      Informe um email válido.
    </div>

    <label>
      Telefone
      <input type="text" formControlName="telefone" placeholder="Digite seu telefone" />
    </label>
    <div class="error" *ngIf="field['telefone'].invalid && field['telefone'].touched">
      Telefone é obrigatório.
    </div>

    <label>
      Formação
      <textarea formControlName="formacao" rows="3" placeholder="Descreva sua formação"></textarea>
    </label>
    <div class="error" *ngIf="field['formacao'].invalid && field['formacao'].touched">
      Formação é obrigatória.
    </div>

    <label>
      Experiência
      <textarea formControlName="experiencia" rows="4" placeholder="Descreva sua experiência profissional"></textarea>
    </label>
    <div class="error" *ngIf="field['experiencia'].invalid && field['experiencia'].touched">
      Experiência é obrigatória.
    </div>

    <label>
      Habilidades
      <textarea formControlName="habilidades" rows="3" placeholder="Liste suas habilidades"></textarea>
    </label>
    <div class="error" *ngIf="field['habilidades'].invalid && field['habilidades'].touched">
      Habilidades são obrigatórias.
    </div>

    <label>
      LinkedIn
      <input type="text" formControlName="linkedin" placeholder="Link do perfil LinkedIn" />
    </label>
    <div class="error" *ngIf="field['linkedin'].invalid && field['linkedin'].touched">
      LinkedIn é obrigatório.
    </div>

    <label>
      Resumo profissional
      <textarea formControlName="resumo" rows="4" placeholder="Resumo rápido sobre você"></textarea>
    </label>

    <div class="actions">
      <button type="submit">{{ isEditMode ? 'Salvar currículo' : 'Cadastrar currículo' }}</button>
      <a routerLink="/curriculos" class="link-button">Voltar</a>
    </div>
  </form>
</section>
